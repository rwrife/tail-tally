name: Native iPhone app
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test scheduling, backup compatibility, and local data safety
        run: swift test
      - name: Build iPhone Simulator app
        run: xcodebuild -project TailTally.xcodeproj -scheme TailTally -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify iPhone-only target
        run: |
          python3 - <<'PY'
          import plistlib
          with open('build/Build/Products/Release-iphonesimulator/TailTally.app/Info.plist', 'rb') as f:
              info = plistlib.load(f)
          assert info['UIDeviceFamily'] == [1], info['UIDeviceFamily']
          PY
      - name: Package simulator build
        run: tar -czf TailTally-iphone-simulator.tar.gz -C build/Build/Products/Release-iphonesimulator TailTally.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TailTally-iphone-simulator
          path: TailTally-iphone-simulator.tar.gz
          if-no-files-found: error
